<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>කෘත්‍රිම සිංචන තොරතුරු-ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය | AI Data Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala';
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 45%, #6ee7b7 100%);
      background-attachment: fixed;
    }

    .rich-header {
      background: linear-gradient(120deg, #022c22 0%, #064e3b 35%, #047857 72%, #0f766e 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #10b981;
      box-shadow: 0 12px 30px -6px rgba(2, 44, 34, 0.55);
    }

    .animated-search-box {
      background: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 58%, #99f6e4 100%);
      border: 2px solid #34d399;
      position: relative;
      overflow: visible;
    }

    .dropdown-menu {
      max-height: 280px;
      overflow-y: auto;
      z-index: 999;
    }

    .dropdown-item:hover {
      background-color: #d1fae5;
    }

    .loader {
      border-top-color: #065f46;
      border-right-color: #059669;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

  <!-- Header -->
  <header class="rich-header text-white p-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-400/20 p-2.5 rounded-xl border border-emerald-300/45">
          <img src="https://img.icons8.com/color/48/cow.png" alt="Cow Icon" class="w-9 h-9">
        </div>
        <div>
          <span class="inline-block text-xs uppercase tracking-wider font-bold text-emerald-200 bg-emerald-950/60 px-2.5 py-0.5 rounded-full border border-emerald-400/30 mb-1">
            Ibbagamuwa Veterinary Office
          </span>
          <h1 class="text-lg md:text-xl font-extrabold tracking-wide text-white">
            කෘත්‍රිම සිංචන තොරතුරු - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය
          </h1>
        </div>
      </div>

      <nav class="flex items-center gap-2 bg-emerald-950/55 p-1.5 rounded-xl border border-emerald-300/30">
        <a href="index.html" class="bg-gradient-to-r from-emerald-300 to-teal-200 text-emerald-950 font-extrabold px-4 py-2 rounded-lg text-sm">කෘත්‍රිම සිංචන දත්ත</a>
        <a href="report.html" class="text-emerald-100 hover:bg-emerald-700/70 hover:text-white font-semibold px-4 py-2 rounded-lg text-sm">Melsiripura LDI දත්ත</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-6 flex-grow w-full">
    <div class="animated-search-box p-6 md:p-8 rounded-3xl shadow-xl mb-8">
      <h2 class="text-lg md:text-xl font-extrabold text-emerald-950 mb-6 flex items-center gap-3">
        <div class="p-2.5 bg-gradient-to-br from-emerald-700 to-teal-800 text-white rounded-xl shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        ගොවිපල අංකය හෝ ගොවිමහතාගේ නම තෝරන්න / ටයිප් කරන්න
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <!-- Farm ID Custom Dropdown -->
        <div class="relative">
          <label for="farmIdInput" class="block text-sm font-bold text-emerald-950 mb-2">
            ගොවිපල අංකය (Farm ID - 6130...):
          </label>
          <input
            type="text"
            id="farmIdInput"
            placeholder="උදා: 6130 හෝ අංකය ටයිප් කරන්න..."
            oninput="onFarmIdInput()"
            onfocus="showFarmIdDropdown()"
            class="w-full p-4 border-2 border-emerald-400/70 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-600/30 focus:border-emerald-700 bg-white font-medium shadow-sm"
            autocomplete="off"
          >
          <div id="farmIdDropdown" class="dropdown-menu hidden absolute left-0 right-0 mt-1 bg-white border-2 border-emerald-400 rounded-2xl shadow-2xl"></div>
        </div>

        <!-- Farmer Name Custom Dropdown -->
        <div class="relative">
          <label for="farmerNameInput" class="block text-sm font-bold text-emerald-950 mb-2">
            ගොවිමහතාගේ නම (Farmer Name):
          </label>
          <input
            type="text"
            id="farmerNameInput"
            placeholder="නම ටයිප් කරන්න..."
            oninput="onFarmerNameInput()"
            onfocus="showFarmerNameDropdown()"
            class="w-full p-4 border-2 border-emerald-400/70 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-600/30 focus:border-emerald-700 bg-white font-medium shadow-sm"
            autocomplete="off"
          >
          <div id="farmerNameDropdown" class="dropdown-menu hidden absolute left-0 right-0 mt-1 bg-white border-2 border-emerald-400 rounded-2xl shadow-2xl"></div>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4">
        <div id="recordCountBadge" class="text-sm font-bold text-emerald-950 bg-white/80 px-4 py-2 rounded-xl border border-emerald-400">
          මුළු කෘත්‍රිම සිංචන වාර්තා ගණන: 0
        </div>

        <div class="flex items-center gap-3">
          <button onclick="loadAllData()" class="bg-white hover:bg-emerald-50 text-emerald-900 font-bold px-5 py-3 rounded-xl text-sm transition duration-300 shadow border border-emerald-400">
            දත්ත යාවත්කාලීන කරන්න (Refresh)
          </button>
          <button onclick="resetSearch()" class="bg-gradient-to-r from-emerald-800 to-teal-800 hover:from-emerald-700 hover:to-teal-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition duration-300 shadow-md">
            නැවත සකසන්න (Reset)
          </button>
        </div>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="flex flex-col items-center justify-center p-12 text-emerald-900">
      <div class="loader rounded-full border-4 border-t-4 border-emerald-200 h-12 w-12 mb-4"></div>
      <p class="font-semibold">Google Sheet වෙතින් සියලු ගොවිපල දත්ත පූරණය වෙමින් පවතී...</p>
    </div>

    <!-- Error Message Box -->
    <div id="errorBox" class="hidden bg-red-50 border-2 border-red-400 text-red-900 p-6 rounded-2xl mb-6 font-semibold shadow"></div>

    <!-- Results Container -->
    <div id="resultsContainer" class="space-y-8"></div>
  </main>

  <script>
    // ඔබේ Google Sheet Published CSV Link එක
    const DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRP84tFeQVUdQPPNKClWWMrsaUDq5dbDwVfj20Fsc1Velr7DDOV2rRX3fxBggu6_uByW8byTV4jsDCV/pub?output=csv";

    let aiRecords = [];
    let farmIdKey = "";
    let farmerNameKey = "";
    let aiDateKey = "";

    const farmIdInput = document.getElementById("farmIdInput");
    const farmerNameInput = document.getElementById("farmerNameInput");
    const farmIdDropdown = document.getElementById("farmIdDropdown");
    const farmerNameDropdown = document.getElementById("farmerNameDropdown");
    const resultsContainer = document.getElementById("resultsContainer");
    const recordCountBadge = document.getElementById("recordCountBadge");
    const loadingIndicator = document.getElementById("loadingIndicator");
    const errorBox = document.getElementById("errorBox");

    // තීරු නාම (Headers) ස්වයංක්‍රීයව හඳුනාගැනීම
    function detectColumnKeys(headers) {
      farmIdKey =
        headers.find(h => /farm\s*id|farm_id|ගොවිපල|අංකය/i.test(h)) ||
        headers[0] || "";

      farmerNameKey =
        headers.find(h => /farmer\s*name|farmer|name|ගොවි|නම/i.test(h) && h !== farmIdKey) ||
        headers[1] || "";

      aiDateKey =
        headers.find(h => /ai\s*date|date|දිනය/i.test(h)) || "";
    }

    function getFarmId(record) {
      return String(record[farmIdKey] || "").trim();
    }

    function getFarmerName(record) {
      return String(record[farmerNameKey] || "").trim();
    }

    function getAiDate(record) {
      return String(aiDateKey ? (record[aiDateKey] || "") : "").trim();
    }

    // Google Sheet CSV වෙතින් දත්ත පූරණය කිරීම
    async function loadAllData() {
      loadingIndicator.classList.remove("hidden");
      errorBox.classList.add("hidden");
      resultsContainer.innerHTML = "";

      try {
        // Cache නොවී අලුත්ම දත්ත ලබාගැනීමට timestamp එකතු කිරීම
        const cacheBusterUrl = `${DATA_URL}&t=${Date.now()}`;
        const response = await fetch(cacheBusterUrl);

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const csvText = await response.text();
        const parsed = parseCSVProperly(csvText);

        if (parsed.headers.length > 0) {
          detectColumnKeys(parsed.headers);
        }

        // Farm ID හෝ Farmer Name තිබෙන වලංගු පේළි පමණක් ගැනීම
        aiRecords = parsed.records.filter(row => getFarmId(row) !== "" || getFarmerName(row) !== "");

        if (aiRecords.length === 0) {
          errorBox.textContent = "Google Sheet එකෙහි දත්ත හමු නොවීය. කරුණාකර Sheet එක Publish කර ඇත්දැයි පරීක්ෂා කරන්න.";
          errorBox.classList.remove("hidden");
        }

        filterExactOrPartial(false);
      } catch (err) {
        console.error("දත්ත පූරණය කිරීමේ දෝෂයකි:", err);
        errorBox.innerHTML = `
          Google Sheet වෙතින් දත්ත ලබාගැනීමට නොහැකි විය. <br>
          <span class="text-sm font-normal">කරුණාකර අන්තර්ජාල සම්බන්ධතාව පරීක්ෂා කරන්න, නැතහොත් මෙම HTML ගොනුව Live Server / Hosting (GitHub Pages, Netlify ආදිය) හරහා විවෘත කරන්න.</span>
        `;
        errorBox.classList.remove("hidden");
      } finally {
        loadingIndicator.classList.add("hidden");
      }
    }

    // හිස් කොටු (Empty cells) සහ කොමා (,) නිවැරදිව කියවන CSV Parser
    function parseCSVProperly(csvText) {
      const rows = [];
      let currentRow = [];
      let currentVal = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentVal += '"';
            i++;
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === "," && !insideQuotes) {
          currentRow.push(currentVal.trim());
          currentVal = "";
        } else if ((char === "\r" || char === "\n") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") i++;
          currentRow.push(currentVal.trim());
          if (currentRow.some(cell => cell !== "")) rows.push(currentRow);
          currentRow = [];
          currentVal = "";
        } else {
          currentVal += char;
        }
      }

      if (currentVal !== "" || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(cell => cell !== "")) rows.push(currentRow);
      }

      if (rows.length < 2) return { headers: [], records: [] };

      // අනවශ්‍ය හිස් Header තීරු මඟහැරීම
      const rawHeaders = rows[0];
      const validIndices = [];
      const headers = [];

      rawHeaders.forEach((h, idx) => {
        const cleanH = h.replace(/^\uFEFF/, "").trim();
        if (cleanH !== "") {
          validIndices.push(idx);
          headers.push(cleanH);
        }
      });

      const records = rows.slice(1).map(row => {
        const obj = {};
        validIndices.forEach((colIdx, i) => {
          obj[headers[i]] = row[colIdx] !== undefined ? row[colIdx] : "";
        });
        return obj;
      });

      return { headers, records };
    }

    // Escape helper for HTML onclick attributes
    function escapeJsString(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    // Farm ID Dropdown
    function renderFarmIdOptions(filterText = "") {
      const query = filterText.trim().toLowerCase();
      const uniqueIds = [...new Set(aiRecords.map(getFarmId))].filter(Boolean);
      const matches = uniqueIds.filter(id => id.toLowerCase().includes(query));

      if (matches.length === 0) {
        farmIdDropdown.innerHTML = `<div class="p-3 text-sm text-gray-500">ගැලපෙන ගොවිපල අංකයක් හමු නොවීය</div>`;
      } else {
        farmIdDropdown.innerHTML = matches.map(id => {
          const farmEntries = aiRecords.filter(r => getFarmId(r) === id);
          const name = farmEntries[0] ? getFarmerName(farmEntries[0]) : "";
          return `
            <div class="dropdown-item px-4 py-3 cursor-pointer border-b border-emerald-100 last:border-b-0 flex justify-between items-center gap-2"
                 onclick="selectFarmId('${escapeJsString(id)}')">
              <div>
                <span class="font-bold text-emerald-950">${id}</span>
                <span class="text-xs text-emerald-700 ml-2">${name ? `(${name})` : ""}</span>
              </div>
              <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full whitespace-nowrap">
                වාර්තා ${farmEntries.length}
              </span>
            </div>
          `;
        }).join("");
      }
      farmIdDropdown.classList.remove("hidden");
    }

    // Farmer Name Dropdown
    function renderFarmerNameOptions(filterText = "") {
      const query = filterText.trim().toLowerCase();
      const uniqueNames = [...new Set(aiRecords.map(getFarmerName))].filter(Boolean);
      const matches = uniqueNames.filter(name => name.toLowerCase().includes(query));

      if (matches.length === 0) {
        farmerNameDropdown.innerHTML = `<div class="p-3 text-sm text-gray-500">ගැලපෙන නමක් හමු නොවීය</div>`;
      } else {
        farmerNameDropdown.innerHTML = matches.map(name => {
          const farmEntries = aiRecords.filter(r => getFarmerName(r) === name);
          const id = farmEntries[0] ? getFarmId(farmEntries[0]) : "";
          return `
            <div class="dropdown-item px-4 py-3 cursor-pointer border-b border-emerald-100 last:border-b-0 flex justify-between items-center gap-2"
                 onclick="selectFarmerName('${escapeJsString(name)}')">
              <div>
                <span class="font-bold text-emerald-950">${name}</span>
                <span class="text-xs text-emerald-700 ml-2">${id ? `(ID: ${id})` : ""}</span>
              </div>
              <span class="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full whitespace-nowrap">
                වාර්තා ${farmEntries.length}
              </span>
            </div>
          `;
        }).join("");
      }
      farmerNameDropdown.classList.remove("hidden");
    }

    function showFarmIdDropdown() {
      renderFarmIdOptions(farmIdInput.value);
      farmerNameDropdown.classList.add("hidden");
    }

    function showFarmerNameDropdown() {
      renderFarmerNameOptions(farmerNameInput.value);
      farmIdDropdown.classList.add("hidden");
    }

    // Dropdown එකෙන් Farm ID තේරූ විට එම ගොවිපලේ සියලුම දිනවල වාර්තා පෙන්වීම
    function selectFarmId(id) {
      farmIdInput.value = id;
      const found = aiRecords.find(r => getFarmId(r) === id);
      if (found) farmerNameInput.value = getFarmerName(found);
      farmIdDropdown.classList.add("hidden");
      filterExactOrPartial(true);
    }

    // Dropdown එකෙන් නම තේරූ විට එම ගොවිමහතාගේ සියලුම දිනවල වාර්තා පෙන්වීම
    function selectFarmerName(name) {
      farmerNameInput.value = name;
      const found = aiRecords.find(r => getFarmerName(r) === name);
      if (found) farmIdInput.value = getFarmId(found);
      farmerNameDropdown.classList.add("hidden");
      filterExactOrPartial(true);
    }

    function onFarmIdInput() {
      renderFarmIdOptions(farmIdInput.value);
      filterExactOrPartial(false);
    }

    function onFarmerNameInput() {
      renderFarmerNameOptions(farmerNameInput.value);
      filterExactOrPartial(false);
    }

    function filterExactOrPartial(isExactSelection = false) {
      const idQuery = farmIdInput.value.trim().toLowerCase();
      const nameQuery = farmerNameInput.value.trim().toLowerCase();

      const filtered = aiRecords.filter(item => {
        const itemId = getFarmId(item).toLowerCase();
        const itemName = getFarmerName(item).toLowerCase();

        if (isExactSelection) {
          return (idQuery && itemId === idQuery) || (nameQuery && itemName === nameQuery);
        }
        const matchesId = !idQuery || itemId.includes(idQuery);
        const matchesName = !nameQuery || itemName.includes(nameQuery);
        return matchesId && matchesName;
      });

      renderGroupedFarms(filtered);
    }

    // එක් එක් ගොවිමහතා යටතේ සියලුම දිනවල කෘත්‍රිම සිංචන විස්තර පෙන්වීම
    function renderGroupedFarms(data) {
      recordCountBadge.textContent = `පෙන්වන මුළු කෘත්‍රිම සිංචන වාර්තා ගණන: ${data.length} / ${aiRecords.length}`;

      if (!data.length) {
        resultsContainer.innerHTML = `
          <div class="bg-white/90 p-8 rounded-2xl text-center text-emerald-900 font-bold shadow">
            සෙවුමට ගැලපෙන කෘත්‍රිම සිංචන වාර්තා හමු නොවීය.
          </div>
        `;
        return;
      }

      // Farm ID + Farmer Name අනුව වාර්තා එකතු (Group) කිරීම
      const grouped = {};
      data.forEach(item => {
        const fId = getFarmId(item);
        const fName = getFarmerName(item);
        const key = `${fId}__${fName}`;
        if (!grouped[key]) {
          grouped[key] = {
            farmId: fId,
            farmerName: fName,
            records: []
          };
        }
        grouped[key].records.push(item);
      });

      resultsContainer.innerHTML = Object.values(grouped).map(group => {
        // දිනය අනුව අනුපිළිවෙළට සැකසීම (අලුත්ම දිනය මුලට)
        const sortedRecords = group.records.sort((a, b) => getAiDate(b).localeCompare(getAiDate(a)));

        const recordsCardsHtml = sortedRecords.map((rec, index) => {
          const aiDate = getAiDate(rec) || `වාර්තාව #${index + 1}`;

          const fieldsHtml = Object.entries(rec)
            .filter(([k, v]) => v !== null && v !== undefined && String(v).trim() !== "")
            .map(([k, v]) => `
              <div class="flex justify-between items-start py-1.5 border-b border-emerald-100/80 last:border-b-0 text-sm gap-2">
                <span class="font-semibold text-emerald-900">${k}:</span>
                <span class="text-gray-800 text-right font-medium">${v}</span>
              </div>
            `).join("");

          return `
            <div class="bg-emerald-50/70 border border-emerald-300 rounded-2xl p-4 shadow-sm hover:shadow-md transition">
              <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-emerald-200">
                <span class="text-xs font-extrabold text-white bg-emerald-700 px-3 py-1 rounded-full">
                  ${aiDate}
                </span>
                <span class="text-xs font-bold text-emerald-800">#${index + 1}</span>
              </div>
              <div class="space-y-0.5">
                ${fieldsHtml}
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="bg-white p-6 md:p-7 rounded-3xl shadow-xl border-l-8 border-emerald-700">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b-2 border-emerald-200">
              <div>
                ${group.farmId ? `
                  <span class="inline-block text-xs font-extrabold uppercase tracking-wider bg-emerald-100 text-emerald-900 px-3 py-1 rounded-full mb-1">
                    Farm ID: ${group.farmId}
                  </span>
                ` : ""}
                <h3 class="text-xl md:text-2xl font-extrabold text-emerald-950">
                  ${group.farmerName || "නම සඳහන් කර නැත"}
                </h3>
              </div>
              <div class="bg-emerald-900 text-white px-4 py-2 rounded-2xl text-sm font-extrabold shadow">
                මුළු සිංචන වාර ගණන: ${sortedRecords.length}
              </div>
            </div>

            <!-- එම ගොවියාගේ සියලුම දිනවල වාර්තා -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${recordsCardsHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function resetSearch() {
      farmIdInput.value = "";
      farmerNameInput.value = "";
      farmIdDropdown.classList.add("hidden");
      farmerNameDropdown.classList.add("hidden");
      renderGroupedFarms(aiRecords);
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#farmIdInput") && !e.target.closest("#farmIdDropdown")) {
        farmIdDropdown.classList.add("hidden");
      }
      if (!e.target.closest("#farmerNameInput") && !e.target.closest("#farmerNameDropdown")) {
        farmerNameDropdown.classList.add("hidden");
      }
    });

    // පිටුව විවෘත වන විට Google Sheet දත්ත පූරණය කිරීම
    loadAllData();
  </script>
</body>
</html>
