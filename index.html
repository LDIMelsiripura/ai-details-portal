<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>කෘත්‍රිම සිංචන තොරතුරු-ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය | AI Data Portal</title>
  
  <!-- Tailwind CSS - Open Source UI Framework -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <style>
    /* සිංහල Fonts සහ තද කොළ පාට පසුබිම් Gradient සඳහා */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala'; 
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 45%, #6ee7b7 100%);
      background-attachment: fixed;
    }

    /* ඉහළ Header කොටස - පහළට වඩා තද හා වර්ණවත් Gradient + Animated Shine */
    .rich-header {
      background: linear-gradient(120deg, #022c22 0%, #064e3b 35%, #047857 72%, #0f766e 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #10b981;
      box-shadow: 0 12px 30px -6px rgba(2, 44, 34, 0.55), 0 4px 12px -2px rgba(4, 120, 87, 0.35);
    }

    .rich-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 18% 50%, rgba(52, 211, 153, 0.24) 0%, transparent 45%),
                  radial-gradient(circle at 82% 30%, rgba(45, 212, 191, 0.22) 0%, transparent 50%);
      animation: headerGlowShift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .rich-header::after {
      content: '';
      position: absolute;
      top: 0;
      left: -130%;
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(167, 243, 208, 0.18), transparent);
      transform: skewX(-22deg);
      animation: headerSheen 5.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes headerGlowShift {
      0% { opacity: 0.75; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes headerSheen {
      0%, 62% { left: -130%; }
      100% { left: 160%; }
    }

    /* Card Entrance & Hover Animations */
    @keyframes cardEnter {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .data-card { 
      animation: cardEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease, border-color 0.35s ease; 
      border-left: 6px solid #065f46;
    }

    .data-card:hover { 
      transform: translateY(-6px) scale(1.005); 
      border-left-color: #059669;
      box-shadow: 0 22px 32px -8px rgba(6, 78, 59, 0.28), 0 10px 14px -6px rgba(5, 150, 105, 0.18); 
    }

    /* Search Box එක සඳහා වන Deep Emerald Gradient සහ Animations */
    .animated-search-box {
      background: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 58%, #99f6e4 100%);
      border: 2px solid #34d399;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .animated-search-box::before {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.18) 0%, rgba(13, 148, 136, 0.09) 42%, transparent 72%);
      animation: pulseGlow 9s infinite linear;
      pointer-events: none;
    }

    .animated-search-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 25%, rgba(255, 255, 255, 0.5) 50%, transparent 75%);
      transform: translateX(-120%);
      animation: lightSweep 6.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.12); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes lightSweep {
      0%, 65% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    .animated-search-box:hover {
      border-color: #059669;
      box-shadow: 0 20px 35px -8px rgba(6, 95, 70, 0.32);
      transform: translateY(-2px);
    }

    /* Floating & Gentle Pulse Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .animate-float-slow {
      animation: floatSlow 3.4s ease-in-out infinite;
    }

    /* Input Focus Lift */
    .emerald-input {
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .emerald-input:focus {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -6px rgba(6, 95, 70, 0.38);
    }

    /* Loader Animation */
    .loader { 
      border-top-color: #065f46; 
      border-right-color: #059669;
      -webkit-animation: spinner 1.05s linear infinite; 
      animation: spinner 1.05s linear infinite; 
    }
    @-webkit-keyframes spinner { 
      0% { -webkit-transform: rotate(0deg); } 
      100% { -webkit-transform: rotate(360deg); } 
    }
    @keyframes spinner { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>

        </div>

          <datalist id="farmerNameOptions">
