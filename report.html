<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ලියාපදිංචි ගොවිපල විස්තර (Registered Farm details) - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala';
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 45%, #6ee7b7 100%);
      background-attachment: fixed;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(8deg) brightness(1.02); }
    }

    .rich-header {
      background: linear-gradient(120deg, #022c22 0%, #064e3b 35%, #047857 72%, #0f766e 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #10b981;
      box-shadow: 0 12px 30px -6px rgba(2, 44, 34, 0.55);
      animation: fadeInDown 0.6s ease-out forwards;
    }

    /* Live Clock Box */
    .clock-widget {
      background-color: rgba(2, 44, 34, 0.75);
      border: 1.5px solid rgba(110, 231, 183, 0.5);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .clock-widget:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(16, 185, 129, 0.35);
    }

    .clock-icon-pulse {
      animation: gentlePulse 2.5s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .animated-search-box {
      background: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 58%, #99f6e4 100%);
      border: 2px solid #34d399;
      position: relative;
      overflow: visible;
      animation: fadeIn 0.65s ease-out forwards;
    }

    .data-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    .data-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(6, 78, 59, 0.2), 0 10px 10px -5px rgba(4, 120, 87, 0.12);
    }

    .dropdown-menu {
      max-height: 280px;
      overflow-y: auto;
      z-index: 999;
      animation: fadeInDown 0.2s ease-out forwards;
    }

    .dropdown-item {
      transition: background-color 0.2s ease, padding-left 0.2s ease;
    }

    .dropdown-item:hover {
      background-color: #d1fae5;
      padding-left: 1.25rem;
    }

    .loader {
      border-top-color: #065f46;
      border-right-color: #059669;
      -webkit-animation: spinner 1.2s linear infinite;
      animation: spinner 1.2s linear infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @-webkit-keyframes spinner {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }

    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #ecfdf5; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #059669; }
  </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col custom-scrollbar">

  <!-- Header -->
  <header class="rich-header text-white p-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3.5">
        <!-- Live Clock Widget -->
        <div id="headerClock" class="clock-widget px-4 py-2.5 rounded-2xl flex items-center gap-3 shrink-0">
          <div class="bg-emerald-500/20 p-2 rounded-xl border border-emerald-300/35 text-emerald-300 clock-icon-pulse">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="leading-tight">
            <div id="liveTime" class="text-base md:text-lg font-extrabold tracking-wider text-emerald-200" style="font-variant-numeric: tabular-nums;">
              12:00:00 PM
            </div>
            <div id="liveDate" class="text-xs font-semibold text-emerald-100" style="font-variant-numeric: tabular-nums;">
              22/11/2026
            </div>
          </div>
        </div>

        <div>
          <span class="inline-block text-xs uppercase tracking-wider font-bold text-emerald-200 bg-emerald-950/60 px-2.5 py-0.5 rounded-full border border-emerald-400/30 mb-1">
            Ibbagamuwa Veterinary Office
          </span>
          <h1 class="text-lg md:text-xl font-extrabold tracking-wide text-white">
            ලියාපදිංචි ගොවිපල විස්තර (Registered Farm details) - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය
          </h1>
        </div>
      </div>

      <nav class="flex items-center gap-2 bg-emerald-950/55 p-1.5 rounded-xl border border-emerald-300/30">
        <a href="index.html" class="text-emerald-100 hover:bg-emerald-700/70 hover:text-white font-semibold px-4 py-2 rounded-lg text-sm transition">කෘත්‍රිම සිංචන දත්ත</a>
        <a href="report.html" class="bg-gradient-to-r from-emerald-300 to-teal-200 text-emerald-950 font-extrabold px-4 py-2 rounded-lg text-sm transition">Melsiripura LDI දත්ත</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-6 flex-grow w-full">
    <div class="animated-search-box p-6 md:p-8 rounded-3xl shadow-xl mb-8">
      <h2 class="text-lg md:text-xl font-extrabold text-emerald-950 mb-6 flex items-center gap-3">
        <div class="p-2.5 bg-gradient-to-br from-emerald-700 to-teal-800 text-white rounded-xl shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        ලියාපදිංචි ගොවිපල අංකය හෝ ගොවිමහතාගේ නම සොයන්න
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <div class="relative">
          <label for="farmSearchInput" class="block text-sm font-bold text-emerald-950 mb-2">
            ගොවිපල අංකය / නම (Farm ID / Name):
          </label>
          <input
            type="text"
            id="farmSearchInput"
            placeholder="ගොවිපල අංකය හෝ නම ටයිප් කරන්න..."
            oninput="renderFarms()"
            class="w-full p-4 border-2 border-emerald-400/70 rounded-2xl focus:outline-none focus:ring-4 focus:ring-emerald-600/30 focus:border-emerald-700 bg-white font-medium shadow-sm transition"
            autocomplete="off"
          >
        </div>

        <div class="flex items-end justify-between md:justify-end gap-3">
          <div id="farmCountBadge" class="text-sm font-bold text-emerald-950 bg-white/85 px-4 py-3 rounded-xl border border-emerald-400 shadow-sm">
            ලියාපදිංචි ගොවිපලවල්: 0
          </div>
          <button
            type="button"
            onclick="document.getElementById('farmSearchInput').value=''; renderFarms();"
            class="bg-gradient-to-r from-emerald-800 to-teal-800 hover:from-emerald-700 hover:to-teal-700 text-white font-bold px-5 py-3 rounded-xl text-sm transition duration-300 shadow-md"
          >
            Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden flex-col items-center justify-center p-12 text-emerald-900">
      <div class="loader rounded-full border-4 border-t-4 border-emerald-200 h-12 w-12 mb-4"></div>
      <p class="font-semibold">ලියාපදිංචි ගොවිපල දත්ත පූරණය වෙමින් පවතී...</p>
    </div>

    <!-- Farms Container -->
    <div id="farmsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const liveTimeEl = document.getElementById("liveTime");
    const liveDateEl = document.getElementById("liveDate");

    function updateLiveClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12;
      hours = hours ? hours : 12;
      const hh = String(hours).padStart(2, "0");

      const dd = String(now.getDate()).padStart(2, "0");
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const yyyy = now.getFullYear();

      if (liveTimeEl) liveTimeEl.textContent = `${hh}:${minutes}:${seconds} ${ampm}`;
      if (liveDateEl) liveDateEl.textContent = `${dd}/${mm}/${yyyy}`;
    }

    updateLiveClock();
    setInterval(updateLiveClock, 1000);

    let registeredFarms = [];

    function renderFarms() {
      const query = (document.getElementById("farmSearchInput")?.value || "").trim().toLowerCase();
      const container = document.getElementById("farmsContainer");
      const badge = document.getElementById("farmCountBadge");

      const filtered = registeredFarms.filter(item =>
        JSON.stringify(item).toLowerCase().includes(query)
      );

      if (badge) {
        badge.textContent = `ලියාපදිංචි ගොවිපලවල්: ${filtered.length}`;
      }

      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white/90 p-8 rounded-3xl text-center text-emerald-900 font-bold shadow-md border border-emerald-300 data-card">
            පෙන්වීමට ගොවිපල දත්ත හමු නොවීය.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((farm, idx) => {
        const entriesHtml = Object.entries(farm)
          .filter(([, v]) => v !== null && v !== undefined && String(v).trim() !== "")
          .map(([k, v]) => `
            <div class="flex justify-between items-start py-1.5 border-b border-emerald-100 last:border-b-0 text-sm gap-2">
              <span class="font-semibold text-emerald-900">${k}:</span>
              <span class="text-gray-800 text-right font-medium">${String(v).trim()}</span>
            </div>
          `).join("");

        return `
          <div class="data-card bg-white p-6 rounded-3xl shadow-lg border-l-8 border-emerald-700" style="animation-delay: ${Math.min(idx * 0.05, 0.4)}s;">
            <div class="space-y-1">${entriesHtml}</div>
          </div>
        `;
      }).join("");
    }

    renderFarms();
  </script>
</body>
</html>
