<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ලියාපදිංචි ගොවිපල විස්තර (Registered Farm details) - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය</title>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala';
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 45%, #6ee7b7 100%);
      background-attachment: fixed;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { filter: hue-rotate(0deg) brightness(1); }
      100% { filter: hue-rotate(8deg) brightness(1.02); }
    }

    .rich-header {
      background: linear-gradient(120deg, #022c22 0%, #064e3b 35%, #047857 72%, #0f766e 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #10b981;
      box-shadow: 0 12px 30px -6px rgba(2, 44, 34, 0.55);
      animation: fadeInDown 0.6s ease-out forwards;
    }

    .title-3d-wrapper {
      perspective: 900px;
    }

    .title-3d-animated {
      font-size: clamp(1.25rem, 2.2vw, 1.95rem);
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #fffbeb 0%, #fde68a 32%, #fbbf24 68%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter:
        drop-shadow(0 1px 0 #b45309)
        drop-shadow(0 2px 0 #92400e)
        drop-shadow(0 3px 0 #78350f)
        drop-shadow(0 4px 0 #022c22)
        drop-shadow(0 8px 16px rgba(245, 158, 11, 0.45));
      transform-style: preserve-3d;
      animation: title3DGoldFloat 4.2s ease-in-out infinite;
    }

    @keyframes title3DGoldFloat {
      0%, 100% {
        transform: rotateX(4deg) rotateY(-2deg) translateY(0px) scale(1);
        filter:
          drop-shadow(0 1px 0 #b45309)
          drop-shadow(0 2px 0 #92400e)
          drop-shadow(0 3px 0 #78350f)
          drop-shadow(0 4px 0 #022c22)
          drop-shadow(0 8px 16px rgba(245, 158, 11, 0.45));
      }
      50% {
        transform: rotateX(-3deg) rotateY(2deg) translateY(-3px) scale(1.015);
        filter:
          drop-shadow(0 1px 0 #f59e0b)
          drop-shadow(0 3px 0 #b45309)
          drop-shadow(0 5px 0 #78350f)
          drop-shadow(0 6px 0 #022c22)
          drop-shadow(0 14px 24px rgba(251, 191, 36, 0.72));
      }
    }

    .emboss-nav-shell {
      background: linear-gradient(145deg, #012119, #053b2c);
      border: 1.5px solid rgba(110, 231, 183, 0.35);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.55),
        inset 0 -1px 2px rgba(110, 231, 183, 0.25),
        0 6px 14px rgba(0, 0, 0, 0.35);
    }

    .emboss-btn-active {
      background: linear-gradient(180deg, #fef3c7 0%, #fcd34d 45%, #f59e0b 100%);
      color: #022c22;
      font-weight: 900;
      border-top: 1.5px solid #fffbeb;
      border-left: 1px solid #fde68a;
      border-right: 1px solid #b45309;
      border-bottom: 3px solid #92400e;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }

    .emboss-btn-active:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .emboss-btn-active:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .emboss-btn-secondary {
      background: linear-gradient(180deg, #10b981 0%, #059669 52%, #047857 100%);
      color: #ecfdf5;
      font-weight: 800;
      border-top: 1.5px solid #6ee7b7;
      border-left: 1px solid #34d399;
      border-right: 1px solid #064e3b;
      border-bottom: 3px solid #022c22;
      text-shadow: 0 1px 2px rgba(2, 44, 34, 0.85);
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(167, 243, 208, 0.55);
      transition: all 0.2s ease;
    }

    .emboss-btn-secondary:hover {
      background: linear-gradient(180deg, #34d399 0%, #10b981 52%, #059669 100%);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow:
        0 6px 14px rgba(16, 185, 129, 0.35),
        inset 0 1px 1px rgba(209, 250, 229, 0.7);
    }

    .emboss-btn-secondary:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .clock-widget {
      background-color: rgba(2, 44, 34, 0.75);
      border: 1.5px solid rgba(110, 231, 183, 0.5);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .clock-widget:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(16, 185, 129, 0.35);
    }

    .clock-icon-pulse {
      animation: gentlePulse 2.5s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .animated-search-box {
      background: linear-gradient(135deg, #ecfdf5 0%, #bbf7d0 58%, #99f6e4 100%);
      border: 2px solid #34d399;
      position: relative;
      overflow: visible;
      z-index: 50;
      animation: fadeIn 0.65s ease-out forwards;
    }

    .data-card {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    .data-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(6, 78, 59, 0.2), 0 10px 10px -5px rgba(4, 120, 87, 0.12);
    }

    .dropdown-menu {
      display: none;
      position: fixed;
      max-height: 320px;
      overflow-y: auto;
      z-index: 999999;
      background-color: #ffffff;
      border: 2px solid #10b981;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      animation: fadeInDown 0.16s ease-out forwards;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      transition: background-color 0.16s ease, padding-left 0.16s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: #d1fae5;
      padding-left: 1.25rem;
    }

    .loader {
      border-top-color: #065f46;
      border-right-color: #059669;
      -webkit-animation: spinner 1.2s linear infinite;
      animation: spinner 1.2s linear infinite;
    }

    .rich-footer {
      background: linear-gradient(120deg, #022c22 0%, #064e3b 45%, #047857 100%);
      border-top: 3px solid #10b981;
      box-shadow: 0 -10px 25px -5px rgba(2, 44, 34, 0.45);
      animation: footerFloatIn 0.9s ease-out forwards;
    }

    .creator-badge {
      display: inline-block;
      animation: creatorGlow 3s ease-in-out infinite;
    }

    @keyframes footerFloatIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes creatorGlow {
      0%, 100% {
        transform: translateY(0px);
        text-shadow: 0 0 6px rgba(110, 231, 183, 0.25);
      }
      50% {
        transform: translateY(-2px);
        text-shadow: 0 0 14px rgba(110, 231, 183, 0.75);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @-webkit-keyframes spinner {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }

    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #ecfdf5; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #059669; }
  </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col custom-scrollbar">

  <!-- Header -->
  <header class="rich-header text-white p-4 md:p-5 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-4">
        <div id="headerClock" class="clock-widget px-4 py-2.5 rounded-2xl flex items-center gap-3 shrink-0">
          <div class="bg-emerald-500/20 p-2 rounded-xl border border-emerald-300/35 text-emerald-300 clock-icon-pulse">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round
